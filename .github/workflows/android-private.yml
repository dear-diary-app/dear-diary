name: Private Android release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.ANDROID_FIREBASE_CONFIG }}
        run: printf '%s' "$FIREBASE_CONFIG" > android-private/google-services.json
      - name: Compile release
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p android-private --no-daemon assembleRelease
      - name: Sign and verify
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/diary.jks"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/diary.password"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/diary.jks" --ks-pass "file:$RUNNER_TEMP/diary.password" --ks-key-alias diary --out Dear-Diary-1.0.apk android-private/build/outputs/apk/release/DearDiaryPrivate-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Dear-Diary-1.0.apk
          rm "$RUNNER_TEMP/diary.jks" "$RUNNER_TEMP/diary.password"
      - uses: actions/upload-artifact@v4
        with:
          name: Dear-Diary-Android
          path: Dear-Diary-1.0.apk
          retention-days: 30
