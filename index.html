<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dear Diary</title>
    <script>
      // Cosmetic first paint only. Saved data never grants access to diary routes.
      try {
        var saved = JSON.parse(localStorage.getItem('sb-etkjcywiaiiphsrthxqe-auth-token') || 'null');
        var uid = saved && saved.user && saved.user.id;
        var theme = uid && localStorage.getItem('dd_background_' + uid);
        var colours = {paper:'#f7efe9',rose:'#f5dfe7',lavender:'#e6def2',sage:'#dfe9d9',sky:'#dbe7f3',midnight:'#1c171d'};
        if (uid && Object.prototype.hasOwnProperty.call(colours, theme)) {
          document.documentElement.style.setProperty('--dd-canvas', colours[theme]);
          document.documentElement.style.setProperty('--dd-colour-scheme', theme === 'midnight' ? 'dark' : 'light');
        }
      } catch (_) { /* Restricted or malformed storage uses neutral paper. */ }
    </script>
    <style>
      html,body { margin:0; background:var(--dd-canvas,#fdf9f4); color-scheme:var(--dd-colour-scheme,light); }
      .dd-auth-splash { box-sizing:border-box; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; text-align:center; background:var(--dd-canvas,#fdf9f4); color:#795f68; font:15px/1.6 system-ui,sans-serif; }
      .dd-auth-splash h1 { font:400 36px Georgia,serif; margin:0 0 12px; }
      .dd-auth-splash p { max-width:340px; }
      html[style*="dark"] .dd-auth-splash { color:#ead8e1; }
      #dd-launch { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; box-sizing:border-box; background:var(--dd-canvas,#fdf9f4); color:#795f68; pointer-events:none; animation:dd-launch-fallback .6s ease 3.4s forwards; }
      #dd-launch svg { width:112px; height:112px; overflow:visible; animation:dd-launch-book 1.6s cubic-bezier(.16,1,.3,1) both; }
      #dd-launch .dd-launch-cover { transform-origin:118px 230px; animation:dd-launch-cover 1.8s cubic-bezier(.2,.7,.2,1) both; }
      #dd-launch .dd-launch-name { font:400 36px/1.2 Georgia,serif; letter-spacing:-.03em; animation:dd-launch-name 1s ease .35s both; }
      #dd-launch .dd-launch-line { width:42px; height:3px; border-radius:3px; background:#d99aa9; animation:dd-launch-line 1s ease .8s both; }
      #dd-launch.is-leaving { animation:dd-launch-exit .6s ease forwards; }
      html[style*="dark"] #dd-launch { color:#ead8e1; }
      .dd-launch-reveal { animation:dd-launch-reveal .6s ease both; }
      @keyframes dd-launch-book { from { opacity:0; transform:translateY(16px) scale(.86) rotate(-7deg); } to { opacity:1; transform:translateY(0) scale(1) rotate(0); } }
      @keyframes dd-launch-cover { from { transform:skewY(-5deg) scaleX(.88); } to { transform:skewY(0) scaleX(1); } }
      @keyframes dd-launch-name { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      @keyframes dd-launch-line { from { opacity:0; transform:scaleX(.2); } to { opacity:1; transform:scaleX(1); } }
      @keyframes dd-launch-exit { to { opacity:0; visibility:hidden; } }
      @keyframes dd-launch-fallback { to { opacity:0; visibility:hidden; } }
      @keyframes dd-launch-reveal { from { opacity:.4; } to { opacity:1; } }
      @media(prefers-reduced-motion:reduce) { #dd-launch { display:none; } #dd-launch,#dd-launch *,.dd-launch-reveal { animation:none!important; } }
    </style>
    <meta name="theme-color" content="#fdf9f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dear Diary" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/diary-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="dd-launch" aria-hidden="true">
      <svg viewBox="0 0 512 512" fill="none" focusable="false" aria-hidden="true">
        <g transform="rotate(-8 256 256)">
          <rect x="126" y="96" width="262" height="340" rx="28" fill="#a87986" opacity=".16"/>
          <rect x="118" y="80" width="266" height="340" rx="26" fill="#a87986"/>
          <rect x="134" y="84" width="250" height="326" rx="24" fill="#fff5e6"/>
          <path d="M147 398H367M147 405H367" stroke="#dfcbbf" stroke-width="3"/>
          <g class="dd-launch-cover">
            <rect x="118" y="72" width="266" height="318" rx="25" fill="#e8aab2"/>
            <path d="M153 74V388" stroke="#c98e9a" stroke-width="4"/>
            <path d="M165 89H359Q368 89 368 100V366Q368 375 359 375H165" stroke="#f8d8dc" stroke-width="2"/>
            <path d="M253 204C227 166 189 194 205 225C214 243 239 260 253 270C268 260 292 243 301 225C317 194 279 166 253 204Z" fill="#fff7ec"/>
            <path d="M224 305H282" stroke="#bc7c8b" stroke-width="5" stroke-linecap="round"/>
          </g>
          <path d="M325 390V444L342 432L359 444V390" fill="#b5a1ce"/>
        </g>
      </svg>
      <span class="dd-launch-name">Dear Diary</span><span class="dd-launch-line"></span>
    </div>
    <script>document.getElementById('dd-launch').dataset.startedAt = String(performance.now());</script>
    <div id="root"><main class="dd-auth-splash" aria-busy="true"><h1>Dear Diary</h1><p role="status">Opening your diaries...</p></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
