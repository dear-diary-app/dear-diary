plugins { id 'com.android.application' version '8.7.3'; id 'com.google.gms.google-services' version '4.4.2' apply false }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
 namespace 'com.deardiary.privateapp'
 compileSdk 35
 defaultConfig { applicationId 'com.deardiary.privateapp'; minSdk 28; targetSdk 35; versionCode 2; versionName '1.1' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res'] } }
 buildTypes { release { debuggable false; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation platform('com.google.firebase:firebase-bom:33.7.0')
 implementation 'com.google.firebase:firebase-messaging'
}
